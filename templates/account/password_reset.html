{% load static %}
{% load i18n %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset – StudentCompanion</title>
    <link rel="stylesheet" href="{% static 'account/css/account.css' %}">
</head>

<body>
<div class="auth-container">

    <!-- Sidebar (same as login screen) -->
    <div class="auth-sidebar">
        <div class="sidebar-content">
            <div class="logo-area">
                <h1 class="brand-name">Reset Your Password</h1>
                <p class="brand-tagline">We'll help you get back into your account</p>
            </div>
        </div>
    </div>

    <!-- Main Section -->
    <div class="auth-main">
        <div class="auth-box">
            <div class="auth-header">
                <h2 class="auth-title">Forgot Password?</h2>
                <p class="auth-subtitle">Enter your email and we'll send you reset instructions</p>
            </div>

            <form method="post" class="auth-form">
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" placeholder="you@example.com" class="form-input" required>
                </div>

                <button class="btn-primary" type="submit">Send Reset Email</button>
            </form>

            <div class="auth-footer">
                <p class="footer-text">
                    Remember your password?
                    <a href="{% url 'account_login' %}" class="footer-link">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>

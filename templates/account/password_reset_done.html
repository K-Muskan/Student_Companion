{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Password Reset Sent – StudentCompanion</title>
    <link rel="stylesheet" href="{% static 'account/css/account.css' %}">
</head>

<body>
<div class="auth-container">

    <div class="auth-sidebar">
        <div class="sidebar-content">
            <h1 class="brand-name">Check Your Inbox</h1>
            <p class="brand-tagline">We've emailed you instructions to reset your password</p>
        </div>
    </div>

    <div class="auth-main">
        <div class="auth-box">
            <div class="auth-header">
                <h2 class="auth-title">Email Sent</h2>
                <p class="auth-subtitle">If an account exists for that email, you'll receive reset instructions.</p>
            </div>

            <a href="{% url 'account_login' %}" class="btn-primary">Back to Login</a>
        </div>
    </div>

</div>
</body>
</html>
